name: Deploy Backend to Lightsail

on:
  push:
    branches: [ master ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: .  # Path to your backend Dockerfile (root of this repo)
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pos-backend:latest

      - name: Restart Backend on Lightsail
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            # Pull the latest backend image
            docker-compose -f docker-compose.prod.yml pull backend
            # Restart ONLY the backend container (prevents frontend/db downtime)
            docker-compose -f docker-compose.prod.yml up -d --no-deps backend
            # Clean up dangling images
            docker system prune -f